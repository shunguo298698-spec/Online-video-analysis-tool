<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码管理后台 · WebCatX</title>
<style>
  :root {
    --ink: #111111; --paper: #f6f1e4; --card: #ffffff; --card-2: #fffdf3;
    --yellow: #ffe24b; --pink: #ff4d9d; --cyan: #2ed3e0; --lime: #c9f24a; --red: #ff3b30; --green: #1fb85a;
    --border: 3px solid var(--ink); --border-thin: 2.5px solid var(--ink);
    --sh: 6px 6px 0 var(--ink); --sh-sm: 4px 4px 0 var(--ink);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background-image:
      repeating-linear-gradient(0deg, rgba(17,17,17,.06) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(17,17,17,.06) 0 1px, transparent 1px 28px);
    padding: 24px 14px 60px;
  }
  .app { max-width: 480px; margin: 0 auto; }
  .head { text-align: center; margin-bottom: 20px; }
  .head h1 {
    display: inline-block; font-size: 22px; font-weight: 900; letter-spacing: 2px;
    padding: 5px 16px; background: var(--cyan); border: var(--border); box-shadow: var(--sh);
    transform: rotate(-1.2deg);
  }
  .head p { margin-top: 12px; font-family: var(--mono); font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #7a7466; }
  .card { background: var(--card); border: var(--border); box-shadow: var(--sh); padding: 16px; margin-bottom: 16px; }
  .lbl {
    font-family: var(--mono); font-size: 11px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 7px;
  }
  .lbl::before { content: '▶'; font-size: 9px; color: var(--pink); }
  .inp {
    width: 100%; padding: 12px; background: #fff; border: var(--border-thin); border-radius: 0;
    font-family: var(--mono); font-size: 13.5px; color: var(--ink); outline: none;
    transition: box-shadow .15s, background .15s;
  }
  .inp:focus { box-shadow: inset 0 0 0 3px var(--yellow); background: var(--card-2); }
  .btn {
    width: 100%; padding: 13px; border: var(--border-thin); background: var(--yellow); color: var(--ink);
    font-family: inherit; font-size: 14px; font-weight: 800; letter-spacing: 1px; border-radius: 0;
    box-shadow: var(--sh-sm); cursor: pointer; transition: transform .1s, box-shadow .1s; margin-top: 10px;
  }
  .btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--sh-sm); }
  .btn.cyan { background: var(--cyan); }
  .btn.lime { background: var(--lime); }
  .btn.ghost { background: var(--card); }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .pass-show {
    margin-top: 12px; padding: 14px; text-align: center; background: var(--ink); color: var(--lime);
    font-family: var(--mono); font-size: 19px; font-weight: 800; letter-spacing: 2px;
    word-break: break-all; user-select: all; border: var(--border-thin); display: none;
  }
  .msg { min-height: 18px; margin-top: 10px; font-size: 12px; font-weight: 800; line-height: 1.6; color: var(--red); word-break: break-word; }
  .msg.ok { color: var(--green); }
  .status-line { font-family: var(--mono); font-size: 11px; font-weight: 800; padding: 8px 10px; border: var(--border-thin); background: var(--card-2); display: flex; justify-content: space-between; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); margin-right: 6px; }
  .dot.on { background: var(--green); } .dot.off { background: var(--red); }
  .note { font-size: 11px; color: #7a7466; font-weight: 700; line-height: 1.8; margin-top: 10px; }
  .log-list { margin-top: 10px; max-height: 260px; overflow-y: auto; border: var(--border-thin); background: var(--ink); padding: 8px; }
  .log-item { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--lime); padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.14); line-height: 1.5; word-break: break-all; }
  .log-item:last-child { border-bottom: none; }
  .log-item .bad { color: var(--red); }
  .log-item .dim { color: #8f8a7c; }
  .log-empty { font-family: var(--mono); font-size: 11px; color: #8f8a7c; text-align: center; padding: 14px 0; }
  .key-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .key-item { border: var(--border-thin); background: var(--card-2); padding: 10px; }
  .key-code { font-family: var(--mono); font-size: 12.5px; font-weight: 800; word-break: break-all; user-select: all; }
  .key-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-family: var(--mono); font-size: 10px; font-weight: 800; }
  .tag { padding: 2px 6px; border: 2px solid var(--ink); background: var(--cyan); }
  .tag.warn { background: var(--yellow); }
  .tag.bound { background: var(--lime); }
  .key-ops { display: flex; gap: 8px; margin-top: 8px; }
  .btn.sm { width: auto; padding: 7px 12px; font-size: 11px; margin-top: 0; }
  .btn.sm.danger { background: var(--red); color: #fff; }
  .btn.sm.confirm { animation: kgblink .5s steps(2) infinite; }
  @keyframes kgblink { 50% { opacity: .55; } }
  .row { display: flex; gap: 8px; }
  .row .inp { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>密码管理后台</h1>
    <p>WEBCATX · ADMIN · MOBILE</p>
  </div>

  <div class="card">
    <div class="lbl">管理员密钥</div>
    <input class="inp" id="adminKey" type="password" placeholder="输入管理员密钥">
    <input class="inp" id="srvInput" type="text" placeholder="后端地址（留空为同源，APP 内置版需填写）" style="margin-top:10px;">
    <button class="btn ghost" onclick="saveSrv()">保存后端地址</button>
    <div class="status-line" style="margin-top:14px;">
      <span id="statusText"><span class="dot off"></span>未连接</span>
      <span id="statusSet"></span>
    </div>
    <button class="btn ghost" onclick="checkStatus()">检测连接</button>
    <div class="msg" id="cfgMsg"></div>
  </div>

  <div class="card">
    <div class="lbl">手动设置新密码</div>
    <input class="inp" id="manualPass" placeholder="输入要设置的访问密码">
    <button class="btn" onclick="setPassword('manual')">设为访问密码</button>
    <div class="note">密码只会以 PBKDF2-SHA256（20 万次迭代）哈希形式存入后端，明文不会上传。</div>
  </div>

  <div class="card">
    <div class="lbl">随机生成强密码</div>
    <div class="row">
      <button class="btn cyan" onclick="genAndSet(12)">12 位</button>
      <button class="btn cyan" onclick="genAndSet(16)">16 位</button>
      <button class="btn cyan" onclick="genAndSet(20)">20 位</button>
    </div>
    <div class="pass-show" id="passShow"></div>
    <button class="btn lime" id="copyBtn" style="display:none;" onclick="copyPass()">复制密码</button>
    <div class="msg" id="genMsg"></div>
  </div>

  <div class="card">
    <div class="lbl">密钥（KEY）管理</div>
    <input class="inp" id="newKey" type="password" placeholder="输入新的管理员密钥（8-64 位）">
    <button class="btn" onclick="changeKey()">修改管理员密钥</button>
    <div class="note">修改后立即生效并持久化保存，旧密钥作废。请牢记新密钥。</div>
    <div class="msg" id="keyMsg"></div>
  </div>

  <div class="card">
    <div class="lbl">访问日志</div>
    <div class="status-line">
      <span id="logCount">0 条记录</span>
      <span id="logTime"></span>
    </div>
    <div class="log-list" id="logList"></div>
    <button class="btn ghost" onclick="loadLogs()">刷新日志</button>
    <div class="msg" id="logMsg"></div>
  </div>

  <div class="card">
    <div class="lbl">软件版密钥 · 生成器</div>
    <div class="row">
      <input class="inp" id="kgTtl" type="number" min="0" placeholder="时长(分钟) 空=不限">
      <input class="inp" id="kgUses" type="number" min="0" placeholder="使用次数 空=不限">
    </div>
    <button class="btn" onclick="kgCreate()">生成软件密钥</button>
    <div class="pass-show" id="kgNew" style="font-size:14px;"></div>
    <div class="key-list" id="kgList"></div>
    <button class="btn ghost" onclick="kgLoad()">刷新密钥列表</button>
    <div class="note">不限创建数量；密钥首次激活即绑定该用户设备，一密钥一用户；次数用尽或时间到期自动删除；用户端将提示"密钥不存在"。</div>
    <div class="msg" id="kgMsg"></div>
  </div>
</div>

<script>
const SALT = 'wcx9f27ab3e51c84d06a71';
const ITER = 200000;
const $ = id => document.getElementById(id);
const base = () => ($('srvInput').value || '').trim().replace(/\/+$/, '');
function saveSrv() {
  localStorage.setItem('wcx_worker', base());
  msg('cfgMsg', '后端地址已保存', true);
}
let lastPass = '';

function msg(id, text, ok) {
  const el = $(id);
  el.textContent = text || '';
  el.classList.toggle('ok', !!ok);
}

async function derive(password) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(SALT), iterations: ITER }, km, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkStatus() {
  msg('cfgMsg', '检测中…', true);
  try {
    const r = await fetch(base() + '/status');
    const d = await r.json();
    $('statusText').innerHTML = '<span class="dot on"></span>已连接';
    $('statusSet').textContent = d.set ? '密码已设置' : '尚未设置密码';
    msg('cfgMsg', '连接正常', true);
  } catch (e) {
    $('statusText').innerHTML = '<span class="dot off"></span>连接失败';
    $('statusSet').textContent = '';
    msg('cfgMsg', '无法连接：' + (e.message || '网络错误'));
  }
}

async function pushHash(h, msgId) {
  const key = $('adminKey').value.trim();
  if (!key) { msg(msgId, '请先填写管理员密钥'); return false; }
  const r = await fetch(base() + '/set', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
    body: JSON.stringify({ h }),
  });
  const d = await r.json().catch(() => ({}));
  if (r.ok && d.ok) return true;
  msg(msgId, d.error === 'deny' ? '管理员密钥错误' : ('设置失败：' + (d.error || r.status)));
  return false;
}

async function setPassword(mode, pass) {
  const msgId = mode === 'manual' ? 'cfgMsg' : 'genMsg';
  if (mode === 'manual') {
    pass = $('manualPass').value;
    if (!pass) { msg('cfgMsg', '请输入要设置的密码'); return; }
  }
  msg(msgId, '正在计算哈希…', true);
  try {
    const h = await derive(pass);
    msg(msgId, '正在上传…', true);
    if (await pushHash(h, msgId)) {
      msg(msgId, '已生效！新密码：' + pass, true);
      checkStatus();
    }
  } catch (e) {
    msg(msgId, '失败：' + (e.message || '网络错误'));
  }
}

function randPass(n) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%&*';
  const buf = new Uint32Array(n);
  crypto.getRandomValues(buf);
  return [...buf].map(v => chars[v % chars.length]).join('');
}

function genAndSet(n) {
  lastPass = randPass(n);
  $('passShow').style.display = 'block';
  $('passShow').textContent = lastPass;
  $('copyBtn').style.display = 'block';
  msg('genMsg', '正在设置…', true);
  setPassword('gen', lastPass);
}

function copyPass() {
  if (!lastPass) return;
  const done = () => msg('genMsg', '已复制', true);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastPass).then(done).catch(done);
  else { const t = document.createElement('textarea'); t.value = lastPass; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
}

const EVENT_LABELS = {
  verify_ok: '验证通过', verify_fail: '密码错误', password_change: '密码已修改',
  key_change: '密钥已修改', app_serve: '页面下发', app_deny: '非法拉取页面',
  set_deny: '越权改密码', key_deny: '越权改密钥',
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadLogs() {
  const key = $('adminKey').value.trim();
  if (!key) { msg('logMsg', '请先填写管理员密钥'); return; }
  msg('logMsg', '加载中…', true);
  try {
    const r = await fetch(base() + '/logs', { headers: { 'X-Admin-Key': key } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { msg('logMsg', d.error === 'deny' ? '管理员密钥错误' : '加载失败'); return; }
    const list = (d.logs || []).slice().reverse();
    $('logCount').textContent = list.length + ' 条记录';
    $('logTime').textContent = list.length ? '最新 ' + list[0].ts : '';
    $('logList').innerHTML = list.length
      ? list.map(e => '<div class="log-item"><span class="dim">' + esc(e.ts) + '</span> ' +
          '<span class="' + (/fail|deny/.test(e.event) ? 'bad' : '') + '">' + esc(EVENT_LABELS[e.event] || e.event) + '</span>' +
          ' <span class="dim">' + esc(e.ip) + '</span></div>').join('')
      : '<div class="log-empty">暂无日志</div>';
    msg('logMsg', '', true);
  } catch (e) {
    msg('logMsg', '加载失败：' + (e.message || '网络错误'));
  }
}

async function changeKey() {
  const key = $('adminKey').value.trim();
  const nw = $('newKey').value.trim();
  if (!key) { msg('keyMsg', '请先填写当前管理员密钥'); return; }
  if (nw.length < 8 || nw.length > 64) { msg('keyMsg', '新密钥长度需 8-64 位'); return; }
  msg('keyMsg', '正在修改…', true);
  try {
    const r = await fetch(base() + '/key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ new: nw }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      $('adminKey').value = nw;
      $('newKey').value = '';
      msg('keyMsg', '密钥已修改并生效', true);
      loadLogs();
    } else {
      msg('keyMsg', d.error === 'deny' ? '当前密钥错误' : ('失败：' + (d.error || r.status)));
    }
  } catch (e) {
    msg('keyMsg', '失败：' + (e.message || '网络错误'));
  }
}

async function kgCreate() {
  const key = $('adminKey').value.trim();
  if (!key) { msg('kgMsg', '请先填写管理员密钥'); return; }
  const ttl = $('kgTtl').value ? parseInt($('kgTtl').value, 10) : null;
  const uses = $('kgUses').value ? parseInt($('kgUses').value, 10) : null;
  msg('kgMsg', '正在生成…', true);
  try {
    const r = await fetch(base() + '/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ ttl_min: ttl, max_uses: uses }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      $('kgNew').style.display = 'block';
      $('kgNew').textContent = d.key;
      msg('kgMsg', '已生成', true);
      kgLoad();
    } else {
      msg('kgMsg', d.error === 'deny' ? '管理员密钥错误' : ('失败：' + (d.error || r.status)));
    }
  } catch (e) {
    msg('kgMsg', '失败：' + (e.message || '网络错误'));
  }
}

function kgFmtLeft(sec) {
  if (sec === null || sec === undefined) return '不限时';
  if (sec <= 0) return '已到期';
  if (sec < 3600) return Math.ceil(sec / 60) + ' 分钟';
  if (sec < 86400) return (sec / 3600).toFixed(1) + ' 小时';
  return (sec / 86400).toFixed(1) + ' 天';
}

async function kgLoad() {
  const key = $('adminKey').value.trim();
  if (!key) { msg('kgMsg', '请先填写管理员密钥'); return; }
  try {
    const r = await fetch(base() + '/keys', { headers: { 'X-Admin-Key': key } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { msg('kgMsg', d.error === 'deny' ? '管理员密钥错误' : '加载失败'); return; }
    const list = d.keys || [];
    $('kgList').innerHTML = list.length ? list.map(k =>
      '<div class="key-item">' +
        '<div class="key-code">' + esc(k.key) + '</div>' +
        '<div class="key-meta">' +
          '<span class="tag' + (k.ttl_left !== null && k.ttl_left < 3600 ? ' warn' : '') + '">⏱ ' + esc(kgFmtLeft(k.ttl_left)) + '</span>' +
          '<span class="tag">✦ ' + (k.uses_left === null ? '不限次' : '剩 ' + k.uses_left + ' 次') + '</span>' +
          (k.bound ? '<span class="tag bound">已绑定设备</span>' : '<span class="tag">未使用</span>') +
        '</div>' +
        '<div class="key-ops"><button class="btn sm danger" data-del="' + esc(k.key) + '" onclick="kgAskDelete(this)">删除</button></div>' +
      '</div>').join('') : '<div class="log-empty">暂无密钥</div>';
    msg('kgMsg', '', true);
  } catch (e) {
    msg('kgMsg', '加载失败：' + (e.message || '网络错误'));
  }
}

function kgAskDelete(btn) {
  if (btn.dataset.confirm === '1') {
    btn.textContent = '删除中…';
    btn.disabled = true;
    kgDelete(btn.dataset.del);
    return;
  }
  btn.dataset.confirm = '1';
  btn.classList.add('confirm');
  btn.textContent = '再次点击确认删除';
  setTimeout(() => {
    if (document.body.contains(btn)) {
      btn.dataset.confirm = '';
      btn.classList.remove('confirm');
      btn.textContent = '删除';
    }
  }, 3000);
}

async function kgDelete(key) {
  const adm = $('adminKey').value.trim();
  try {
    const r = await fetch(base() + '/keys/del', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adm },
      body: JSON.stringify({ k: key }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      msg('kgMsg', '已删除：' + key, true);
      kgLoad();
    } else {
      msg('kgMsg', '删除失败：' + (d.error || r.status));
    }
  } catch (e) {
    msg('kgMsg', '删除失败：' + (e.message || '网络错误'));
  }
}

checkStatus();
</script>
</body>
</html>
