<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>短视频解析 · WebCatX</title>
<style>
  /* ================= 设计 Token ================= */
  :root {
    --bg-image: url('rm.png');
    --bg-dim: 0.16;

    --ink: #111111;
    --paper: #f6f1e4;
    --card: #ffffff;
    --card-2: #fffdf3;

    --yellow: #ffe24b;
    --pink: #ff4d9d;
    --cyan: #2ed3e0;
    --lime: #c9f24a;
    --blue: #3b5bff;
    --orange: #ff7a29;
    --red: #ff3b30;
    --green: #1fb85a;

    --border: 3px solid var(--ink);
    --border-thin: 2.5px solid var(--ink);
    --sh: 6px 6px 0 var(--ink);
    --sh-sm: 4px 4px 0 var(--ink);
    --sh-xs: 2px 2px 0 var(--ink);

    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --text-primary: #111111;
    --text-secondary: #3a3a3a;
    --text-muted: #7a7466;
  }

  /* ================= 基础重置 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; background-color: var(--paper); }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    background: var(--paper);
  }

  /* ================= 背景层 ================= */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    filter: grayscale(1) contrast(1.15) brightness(1.1);
    z-index: -3;
    pointer-events: none;
    transform: translateZ(0);
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(17,17,17,.075) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(17,17,17,.075) 0 1px, transparent 1px 28px);
    background-color: rgba(246, 241, 228, calc(0.5 + var(--bg-dim) * 0.62));
    z-index: -2;
    pointer-events: none;
  }

  /* ================= 布局 ================= */
  .app { max-width: 580px; margin: 0 auto; padding: 0 16px 70px; position: relative; }
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px 0;
  }
  body:has(.result.show) .hero { min-height: 0; padding: 26px 0 10px; }

  /* ================= 头部 ================= */
  .header {
    text-align: center;
    margin-bottom: 22px;
    animation: popDown .5s cubic-bezier(.22,1.3,.5,1) both;
  }
  .header h1 {
    display: inline-block;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.15;
    padding: 4px 16px;
    color: var(--ink);
    background: var(--yellow);
    border: var(--border);
    box-shadow: var(--sh);
    transform: rotate(-1.5deg);
  }
  .header h1::before {
    content: '✦';
    margin-right: 6px;
    font-size: 19px;
    color: var(--pink);
    animation: spinSlow 6s linear infinite;
    display: inline-block;
  }
  @keyframes spinSlow { to { transform: rotate(360deg); } }

  .header p {
    margin-top: 16px;
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    padding: 4px 12px;
  }

  /* ================= 平台标签 ================= */
  .platforms {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    animation: popDown .55s .06s cubic-bezier(.22,1.3,.5,1) both;
  }
  .platform-tag {
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .5px;
    padding: 5px 11px;
    background: var(--card);
    border: var(--border-thin);
    box-shadow: var(--sh-xs);
    color: var(--ink);
    transition: transform .12s, box-shadow .12s;
    cursor: default;
    user-select: none;
  }
  .platform-tag:nth-child(1) { background: #ffd7e9; }
  .platform-tag:nth-child(2) { background: #ffe6c9; }
  .platform-tag:nth-child(3) { background: #d8e6ff; }
  .platform-tag:nth-child(4) { background: #ffd9d9; }
  .platform-tag:nth-child(5) { background: #d4f4fb; }
  .platform-tag.tag-action { cursor: pointer; }
  .platform-tag.tag-scan { background: var(--yellow); }
  .platform-tag.tag-set { background: var(--cyan); }
  .platform-tag.tag-action:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  /* ================= 卡片 ================= */
  .glass-card {
    background: var(--card);
    border: var(--border);
    box-shadow: var(--sh);
    animation: popUp .45s cubic-bezier(.22,1.3,.5,1) both;
  }

  @keyframes popUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= 输入区 ================= */
  .input-card { padding: 16px; }
  .input-card label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .input-card label::before {
    content: '▶';
    font-size: 9px;
    color: var(--pink);
  }
  textarea {
    width: 100%;
    height: 96px;
    background: #fff;
    border: var(--border-thin);
    border-radius: 0;
    color: var(--ink);
    font-size: 14px;
    font-family: var(--mono);
    padding: 12px;
    resize: none;
    outline: none;
    line-height: 1.6;
    transition: box-shadow .15s, background .15s;
  }
  textarea:focus {
    box-shadow: inset 0 0 0 3px var(--yellow);
    background: var(--card-2);
  }
  textarea::placeholder { color: #a3a094; }

  /* ================= 按钮 ================= */
  .btn {
    border: var(--border-thin);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: .5px;
    padding: 12px 16px;
    border-radius: 0;
    box-shadow: var(--sh-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform .1s, box-shadow .1s, background .15s;
    user-select: none;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: var(--sh-sm); }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }

  .btn-primary { flex: 1; background: var(--yellow); }
  .btn-primary:hover:not(:disabled) { background: #fff06b; }

  .btn-glass { background: var(--paper); }
  .btn-glass:hover { background: #fff; }

  .btn-clear { flex: 0 0 80px; }

  .btn-row-history { margin-top: 10px; }
  .btn-history { flex: 1; background: var(--card); }
  .btn-history .his-num {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    color: #8a8578;
  }

  /* ================= 状态条 ================= */
  .status {
    display: none;
    margin-top: 16px;
    padding: 11px 14px;
    border: var(--border-thin);
    box-shadow: var(--sh-xs);
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .3px;
    text-align: center;
    animation: fadeIn .25s ease;
    word-break: break-word;
  }
  .status.show { display: block; }
  .status.loading { background: var(--yellow); color: var(--ink); }
  .status.error { background: var(--red); color: #fff; border-color: var(--ink); }
  .status.success { background: var(--lime); color: var(--ink); }

  /* ================= 结果区 ================= */
  .result { display: none; }
  .result.show { display: block; }
  .result-card { margin-bottom: 16px; }

  .card-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--paper);
    border-bottom: var(--border-thin);
  }
  .card-header .title {
    font-size: 12.5px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-header .title::before {
    content: '■';
    font-size: 9px;
    color: var(--pink);
  }
  .card-header .badge {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .5px;
    padding: 3px 9px;
    background: var(--ink);
    color: var(--paper);
    white-space: nowrap;
  }
  .card-body { padding: 14px 16px; }

  /* ================= 视频 ================= */
  .video-wrap {
    border: var(--border-thin);
    background: #000;
    margin-bottom: 14px;
    overflow: hidden;
    animation: fadeIn .35s ease;
  }
  .video-wrap video {
    width: 100%;
    display: block;
    max-height: 400px;
    object-fit: contain;
  }
  .video-error {
    padding: 42px 18px;
    text-align: center;
    color: #ded9c9;
    font-size: 12.5px;
    font-weight: 700;
    font-family: var(--mono);
  }

  /* ================= 封面 ================= */
  .cover-section {
    margin-bottom: 14px;
    border: var(--border-thin);
    background: var(--paper);
    overflow: hidden;
    animation: fadeIn .35s ease .05s both;
  }
  .cover-title {
    padding: 9px 12px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-bottom: 2px dashed rgba(17,17,17,.3);
    background: var(--card-2);
  }
  .cover-title .hint {
    font-family: var(--mono);
    font-size: 10px;
    color: #8a8578;
  }
  .cover-img-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    max-height: 240px;
    overflow: hidden;
  }
  .cover-img-wrap img {
    width: 100%; height: auto; max-height: 240px;
    object-fit: contain; display: block;
  }
  .cover-actions {
    position: absolute; right: 10px; bottom: 10px;
    display: flex; gap: 6px;
  }
  .mini-btn {
    height: 28px;
    padding: 0 12px;
    border: 2px solid var(--ink);
    background: var(--yellow);
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .mini-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  /* ================= 作者 ================= */
  .author-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .avatar {
    width: 52px; height: 52px;
    border: var(--border-thin);
    background: var(--paper);
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: var(--sh-xs);
  }
  .author-info { flex: 1; min-width: 0; }
  .author-name {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .verified-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: var(--blue);
    color: #fff;
    font-size: 9px;
    font-weight: 900;
    flex-shrink: 0;
  }
  .author-meta {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 5px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .author-signature {
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.65;
    color: var(--text-secondary);
    padding: 9px 11px;
    background: var(--card-2);
    border: 2px dashed rgba(17,17,17,.35);
    word-break: break-word;
  }

  /* ================= 数据统计 ================= */
  .stats-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .stat-item {
    flex: 1;
    min-width: 70px;
    padding: 9px 6px;
    text-align: center;
    background: var(--card-2);
    border: 2px solid var(--ink);
    transition: background .15s, transform .15s;
  }
  .stat-item:nth-child(2n) { background: #fff7d6; }
  .stat-item:hover { transform: translateY(-2px); }
  .stat-item .s-val {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: -.3px;
    color: var(--ink);
  }
  .stat-item .s-lbl {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* ================= 话题标签 ================= */
  .tags-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .tag-chip {
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 11px;
    background: var(--yellow);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    color: var(--ink);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  .tag-chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  /* ================= 折叠面板 ================= */
  .detail-header, .desc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    background: var(--paper);
    border-bottom: var(--border-thin);
    transition: background .15s;
  }
  .detail-header:hover, .desc-header:hover { background: #fbf3d6; }
  .detail-header .title, .desc-header .title {
    font-size: 12.5px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .detail-header .title::before, .desc-header .title::before {
    content: '■';
    font-size: 9px;
    color: var(--cyan);
  }
  .detail-header .toggle-text, .desc-header .toggle-text {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    color: #8a8578;
    white-space: nowrap;
  }
  .fold-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .38s cubic-bezier(.22,1,.36,1);
  }
  .fold-wrap.expanded { grid-template-rows: 1fr; }
  .fold-inner { overflow: hidden; min-height: 0; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
    padding: 12px 16px 14px;
  }
  .detail-item {
    padding: 9px 11px;
    background: var(--card-2);
    border: 2px solid rgba(17,17,17,.85);
    overflow: hidden;
  }
  .detail-item.wide { grid-column: span 2; }
  .detail-item .d-lbl {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 4px;
    letter-spacing: .5px;
  }
  .detail-item .d-val {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink);
    word-break: break-all;
    line-height: 1.45;
  }
  .detail-item .d-val.mono { font-family: var(--mono); font-size: 11.5px; color: #24408f; }
  .detail-item .d-val.green { color: #0f7a3c; }
  .detail-item .d-val.orange { color: #b2530a; }
  .detail-item .d-val.pink { color: #a8155e; }

  .desc-content {
    padding: 12px 16px 16px;
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ================= 操作按钮组 ================= */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin-top: 14px;
  }
  .action-grid .btn { padding: 12px 8px; font-size: 12.5px; }

  .btn-download { background: var(--cyan); }
  .btn-download:hover { background: #63e3ec; }
  .btn-save { background: var(--lime); }
  .btn-save:hover { background: #d9ff6e; }
  .btn-share { background: #ffc9e2; }
  .btn-share:hover { background: #ffdcec; }
  .btn-copy { background: var(--yellow); }
  .btn-copy:hover { background: #fff06b; }

  /* ================= 图集 ================= */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 4px;
  }
  .img-item {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--paper);
    border: 2px solid var(--ink);
    cursor: pointer;
    transition: transform .12s;
  }
  .img-item:active { transform: scale(.95); }
  .img-item img, .img-item video {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  /* 兜底：修复浅色背景下 JS 注入的浅色提示文字 */
  .img-item > div[style] { color: var(--ink) !important; font-weight: 800; }

  .img-index {
    position: absolute; bottom: 4px; right: 4px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 800;
    background: var(--ink);
    color: var(--paper);
    padding: 1px 6px;
  }
  .img-type-badge {
    position: absolute; top: 5px; left: 5px;
    font-size: 9.5px;
    font-weight: 900;
    padding: 1px 7px;
    background: var(--pink);
    color: #fff;
    border: 1.5px solid var(--ink);
  }
  .img-save-btn {
    position: absolute; top: 5px; right: 5px;
    min-width: 26px; height: 26px;
    padding: 0 7px;
    border: 2px solid var(--ink);
    background: var(--yellow);
    color: var(--ink);
    font-size: 10.5px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    z-index: 2;
    box-shadow: 2px 2px 0 rgba(0,0,0,.85);
    transition: transform .1s, box-shadow .1s;
  }
  .img-save-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  /* ================= 空状态 ================= */
  .empty-state {
    text-align: center;
    padding: 38px 20px;
    color: var(--ink);
    background: rgba(255,255,255,.6);
    border: 3px dashed var(--ink);
    animation: fadeIn .35s .1s ease both;
  }
  .empty-state p {
    font-size: 13px;
    font-weight: 800;
    line-height: 1.9;
    letter-spacing: .5px;
  }

  /* ================= 日志 ================= */
  .log-card { margin-top: 18px; overflow: hidden; animation-delay: .12s; }
  .log-header {
    padding: 11px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    background: var(--paper);
    transition: background .15s;
  }
  .log-header:hover { background: #fbf3d6; }
  .log-header .title {
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .log-header .title::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--green);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .log-header .right { display: flex; align-items: center; gap: 8px; }
  .log-count {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 800;
    padding: 1px 8px;
    background: var(--ink);
    color: var(--paper);
  }
  .log-toggle {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    color: #8a8578;
    white-space: nowrap;
  }
  .log-body-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .38s cubic-bezier(.22,1,.36,1);
  }
  .log-body-wrap.expanded { grid-template-rows: 1fr; }
  .log-body-inner { overflow: hidden; min-height: 0; }
  .log-body {
    padding: 10px 14px 14px;
    max-height: 220px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.75;
    color: var(--text-secondary);
    border-top: 2px dashed rgba(17,17,17,.3);
    background: var(--card-2);
    scrollbar-width: thin;
  }
  .log-body::-webkit-scrollbar { width: 4px; }
  .log-body::-webkit-scrollbar-thumb { background: rgba(17,17,17,.35); }
  .log-line { margin-bottom: 3px; word-break: break-all; }
  .log-line .t { color: var(--text-muted); margin-right: 7px; font-weight: 700; }
  .log-line.ok .msg { color: #0f7a3c; font-weight: 700; }
  .log-line.err .msg { color: #c31a12; font-weight: 700; }
  .log-line.info .msg { color: #24408f; }

  /* ================= Toast ================= */
  .toast-msg {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: var(--ink);
    color: var(--paper);
    border: 2.5px solid var(--ink);
    box-shadow: 5px 5px 0 rgba(17,17,17,.3);
    padding: 11px 22px;
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .3px;
    z-index: 9999;
    opacity: 0;
    transition: opacity .22s, transform .28s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    max-width: 86vw;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ================= 加载转圈 ================= */
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(17,17,17,.22);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: -2px;
  }

  /* ================= 兜底提示 ================= */
  .fallback-hint {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--yellow);
    border: var(--border-thin);
    box-shadow: var(--sh-xs);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.7;
    color: var(--ink);
    text-align: left;
  }
  .fallback-btn {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    font-size: 12.5px;
    font-weight: 800;
    font-family: inherit;
    border: var(--border-thin);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(17,17,17,.35);
    transition: transform .1s, box-shadow .1s;
  }
  .fallback-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

  /* ================= 全屏面板 ================= */
  body.history-open { overflow: hidden; }
  .history-panel {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    transform: translateY(100%);
    transition: transform .34s cubic-bezier(.22,1,.36,1);
    will-change: transform;
  }
  .history-panel::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(17,17,17,.045) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(17,17,17,.045) 0 1px, transparent 1px 26px);
    pointer-events: none;
    z-index: 0;
  }
  .history-panel.show { transform: translateY(0); }

  .history-head {
    position: relative;
    z-index: 1;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: var(--border);
    background: var(--yellow);
    flex-shrink: 0;
  }
  .history-head-title {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .history-count {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    padding: 1px 8px;
    background: var(--ink);
    color: var(--paper);
    vertical-align: middle;
  }
  .history-head-actions { display: flex; gap: 8px; }
  .history-clear-btn, .history-close-btn {
    padding: 7px 13px;
    border: 2.5px solid var(--ink);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s, background .15s;
    white-space: nowrap;
  }
  .history-close-btn:active, .history-clear-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .history-clear-btn[data-confirming="1"] { background: var(--red); color: #fff; }

  .history-body {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }

  /* ================= 历史项 ================= */
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 2px solid rgba(17,17,17,.85);
    cursor: pointer;
    transition: background .15s;
  }
  .history-item:active { background: #fff7d6; }
  .history-thumb {
    width: 64px; height: 64px;
    border: 2.5px solid var(--ink);
    overflow: hidden;
    background: var(--paper);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--sh-xs);
  }
  .history-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .history-info { flex: 1; min-width: 0; }
  .history-title {
    font-size: 13.5px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-meta {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-load-btn {
    flex-shrink: 0;
    padding: 8px 13px;
    border: 2.5px solid var(--ink);
    background: var(--yellow);
    color: var(--ink);
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .history-load-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .history-empty {
    text-align: center;
    padding: 64px 20px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text-muted);
    line-height: 2.2;
  }
  .history-empty span { font-size: 12px; opacity: .7; font-weight: 700; }

  /* ================= 设置 ================= */
  .setting-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .setting-section { display: flex; flex-direction: column; gap: 10px; }
  .setting-label {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .setting-label::before {
    content: '▶';
    font-size: 9px;
    color: var(--pink);
  }
  .setting-input {
    width: 100%;
    padding: 11px 13px;
    background: #fff;
    border: var(--border-thin);
    color: var(--ink);
    font-size: 13px;
    font-family: var(--mono);
    outline: none;
    transition: box-shadow .15s, background .15s;
  }
  .setting-input:focus {
    box-shadow: inset 0 0 0 3px var(--yellow);
    background: var(--card-2);
  }
  .setting-row { display: flex; gap: 9px; }
  .setting-row .setting-input { flex: 1; min-width: 0; }
  .setting-row .btn { flex: 0 0 auto; padding: 11px 18px; font-size: 12.5px; }

  .bg-preview {
    width: 100%;
    height: 140px;
    border: var(--border-thin);
    box-shadow: var(--sh-sm);
    background-color: #fff;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .bg-presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .bg-preset {
    position: relative;
    aspect-ratio: 16/10;
    border: 2.5px solid var(--ink);
    overflow: hidden;
    cursor: pointer;
    background-color: #fff;
    background-size: cover;
    background-position: center;
    box-shadow: var(--sh-xs);
    transition: transform .1s, box-shadow .1s;
  }
  .bg-preset:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .bg-preset span {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 0;
    text-align: center;
    background: var(--ink);
    color: var(--paper);
  }

  .dim-row { display: flex; align-items: center; gap: 14px; }
  .dim-row input[type=range] {
    flex: 1;
    accent-color: var(--ink);
    height: 4px;
    cursor: pointer;
  }
  .dim-val {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
    width: 52px;
    text-align: right;
  }

  /* ================= 相机面板 ================= */
  .scan-cam-wrap {
    position: relative;
    width: 100%;
    height: 46vh;
    min-height: 220px;
    max-height: 420px;
    overflow: hidden;
    background: #111;
    border: var(--border);
    box-shadow: var(--sh-sm);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scan-cam-wrap::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 2px dashed rgba(255,255,255,.32);
    pointer-events: none;
    z-index: 2;
  }
  .scan-cam-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .scan-cam-hint {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 16px;
    font-size: 11.5px;
    font-weight: 800;
    text-align: center;
    color: var(--paper);
    background: linear-gradient(transparent, rgba(0,0,0,.9));
    pointer-events: none;
    z-index: 3;
  }
  .scan-preview-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    z-index: 1;
  }
  .scan-actions { display: flex; gap: 9px; }
  .scan-actions .btn { flex: 1; padding: 12px; font-size: 12.5px; }
  .scan-status {
    font-size: 12px;
    font-weight: 800;
    line-height: 1.65;
    text-align: center;
    padding: 10px 14px;
    background: var(--yellow);
    border: var(--border-thin);
    box-shadow: var(--sh-xs);
    color: var(--ink);
  }
  .scan-status.ok { background: var(--lime); }
  .scan-status.error { background: var(--red); color: #fff; }
  .scan-status.busy { background: var(--cyan); }

  .scan-keywords { display: flex; flex-wrap: wrap; gap: 7px; }
  .scan-chip {
    font-size: 11.5px;
    font-weight: 800;
    padding: 5px 11px;
    background: var(--card-2);
    border: 2px solid var(--ink);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
    word-break: break-all;
  }
  .scan-chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .scan-chip.author { background: #ffd7e9; }
  .scan-chip.tag { background: #e6dcff; }
  .scan-chip.link { background: var(--lime); }

  .scan-rawtext {
    padding: 11px 13px;
    background: #fff;
    border: var(--border-thin);
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.75;
    color: var(--text-secondary);
    max-height: 170px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ================= 搜索结果 ================= */
  .search-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 22px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--text-secondary);
  }
  .search-result-list { display: flex; flex-direction: column; gap: 9px; }
  .search-result-item {
    display: flex;
    gap: 11px;
    padding: 11px;
    background: var(--card);
    border: 2.5px solid var(--ink);
    box-shadow: var(--sh-xs);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s, background .15s;
  }
  .search-result-item:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); background: #fff7d6; }
  .search-result-thumb {
    width: 54px; height: 54px;
    flex-shrink: 0;
    background: var(--yellow);
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    color: var(--ink);
    font-size: 18px;
    font-weight: 900;
  }
  .search-result-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .search-result-title {
    font-size: 12.5px;
    font-weight: 800;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .search-result-meta {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 5px;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-result-badge {
    padding: 1px 7px;
    background: var(--ink);
    color: var(--paper);
    font-size: 9.5px;
    font-weight: 800;
  }
  .search-empty {
    padding: 22px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    line-height: 1.85;
    border: 2px dashed rgba(17,17,17,.35);
    background: rgba(255,255,255,.6);
  }

</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="header">
      <h1>视频解析</h1>
      <p>无水印 · 图集 · 文案</p>
    </div>
    <div class="platforms">
      <span class="platform-tag">抖音</span>
      <span class="platform-tag">快手</span>
      <span class="platform-tag">B站</span>
      <span class="platform-tag">小红书</span>
      <span class="platform-tag">豆包</span>
      <span class="platform-tag tag-action tag-scan" onclick="openScanPanel()">扫描</span>
      <span class="platform-tag tag-action tag-set" onclick="openSettings()">设置</span>
    </div>
    <div class="input-card glass-card">
      <label>粘贴分享链接或文案</label>
      <textarea id="linkInput" placeholder="粘贴 App 分享文案或链接"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="parseBtn" onclick="doParse()"><span id="parseBtnText">解析</span></button>
        <button class="btn btn-glass btn-clear" onclick="clearAll()">清空</button>
      </div>
      <div class="btn-row btn-row-history">
        <button class="btn btn-glass btn-history" onclick="openHistory()">历史解析<span class="his-num" id="historyBtnCount"></span></button>
      </div>
    </div>
    <div class="status" id="statusBar"></div>
  </div>
  <div class="result" id="resultArea">
    <div class="result-card glass-card" id="videoCard" style="display:none;">
      <div class="card-header"><span class="title">视频</span><span class="badge" id="videoBadge">—</span></div>
      <div class="card-body">
        <div class="video-wrap" id="videoWrap"></div>
        <div class="cover-section" id="coverSection" style="display:none;">
          <div class="cover-title"><span>视频封面</span><span class="hint">// 点击右侧按钮保存</span></div>
          <div class="cover-img-wrap">
            <img id="coverImg" alt="封面">
            <div class="cover-actions">
              <button class="mini-btn" onclick="saveCover()">保存</button>
              <button class="mini-btn" onclick="previewCover()">预览</button>
            </div>
          </div>
        </div>
        <div class="author-row" id="authorRow" style="display:none;">
          <img class="avatar" id="authorAvatar" alt="" onerror="this.style.display='none'">
          <div class="author-info">
            <div class="author-name" id="authorName">—</div>
            <div class="author-meta" id="authorMeta"></div>
          </div>
        </div>
        <div class="author-signature" id="authorSignature" style="display:none;"></div>
        <div class="stats-row" id="statsRow"></div>
        <div class="tags-row" id="tagsRow" style="display:none;"></div>
        <div class="action-grid">
          <button class="btn btn-download" onclick="downloadVideo()">下载视频</button>
          <button class="btn btn-save" onclick="saveVideoToAlbum()">存相册</button>
          <button class="btn btn-share" onclick="shareVideo()">分享</button>
          <button class="btn btn-copy" onclick="copyVideoUrl()">复制链接</button>
        </div>
      </div>
    </div>
    <div class="result-card glass-card" id="detailCard" style="display:none;">
      <div class="detail-header" onclick="toggleDetail()"><span class="title">详细信息</span><span class="toggle-text" id="detailToggle">展开 ▼</span></div>
      <div class="fold-wrap" id="detailFold"><div class="fold-inner"><div class="detail-grid" id="detailGrid"></div></div></div>
    </div>
    <div class="result-card glass-card" id="descCard" style="display:none;">
      <div class="desc-header" onclick="toggleDesc()"><span class="title">视频文案</span><span class="toggle-text" id="descToggle">展开 ▼</span></div>
      <div class="fold-wrap" id="descFold"><div class="fold-inner"><div class="desc-content" id="descContent"></div></div></div>
    </div>
    <div class="result-card glass-card" id="imageCard" style="display:none;">
      <div class="card-header"><span class="title">图集 / 动态图片</span><span class="badge" id="imageBadge">—</span></div>
      <div class="card-body">
        <div class="author-row" id="imageAuthorRow" style="display:none;">
          <img class="avatar" id="imageAuthorAvatar" alt="" onerror="this.style.display='none'">
          <div class="author-info">
            <div class="author-name" id="imageAuthorName">—</div>
            <div class="author-meta" id="imageAuthorMeta"></div>
          </div>
        </div>
        <div class="image-grid" id="imageGrid"></div>
        <div class="action-grid" style="margin-top:14px;grid-template-columns:repeat(3,1fr);">
          <button class="btn btn-save" onclick="saveAllImages()">全部存相册</button>
          <button class="btn btn-download" onclick="downloadAllImages()">下载全部</button>
          <button class="btn btn-copy" onclick="copyImageUrls()">复制链接</button>
        </div>
      </div>
    </div>
    <div class="empty-state" id="emptyState"><p>粘贴链接后点击解析<br>自动读取剪贴板</p></div>
  </div>
  <div class="log-card glass-card" id="logCard">
    <div class="log-header" onclick="toggleLog()">
      <span class="title">运行日志</span>
      <span class="right"><span class="log-count" id="logCount">0</span><span class="log-toggle" id="logToggle">展开 ▼</span></span>
    </div>
    <div class="log-body-wrap" id="logBodyWrap"><div class="log-body-inner"><div class="log-body" id="logBody"></div></div></div>
  </div>
</div>

<!-- 历史面板 -->
<div class="history-panel" id="historyPanel">
  <div class="history-head">
    <span class="history-head-title">历史解析<span class="history-count" id="historyCount">0</span></span>
    <div class="history-head-actions">
      <button class="history-clear-btn" id="historyClearBtn" onclick="clearHistory()">清空</button>
      <button class="history-close-btn" onclick="closeHistory()">关闭</button>
    </div>
  </div>
  <div class="history-body">
    <div class="history-empty" id="historyEmpty">暂无解析记录<br><span>解析成功后会保存到这里</span></div>
    <div id="historyList"></div>
  </div>
</div>

<!-- 设置面板 -->
<div class="history-panel" id="settingsPanel">
  <div class="history-head">
    <span class="history-head-title">设置</span>
    <div class="history-head-actions"><button class="history-close-btn" onclick="closeSettings()">关闭</button></div>
  </div>
  <div class="history-body">
    <div class="setting-body">
      <div class="setting-section">
        <div class="setting-label">当前背景预览</div>
        <div class="bg-preview" id="bgPreview"></div>
      </div>
      <div class="setting-section">
        <div class="setting-label">背景图片链接</div>
        <div class="setting-row">
          <input class="setting-input" id="bgUrlInput" type="url" placeholder="粘贴图片直链 https://…">
          <button class="btn btn-primary" onclick="applyBgUrl()">应用</button>
        </div>
      </div>
      <div class="setting-section">
        <div class="setting-label">从相册选择图片</div>
        <button class="btn btn-glass" style="padding:13px;font-size:13px;" onclick="document.getElementById('bgFileInput').click()">选择本地图片</button>
        <input type="file" id="bgFileInput" accept="image/*" style="display:none" onchange="onBgFileChange(event)">
      </div>
      <div class="setting-section">
        <div class="setting-label">预设背景</div>
        <div class="bg-presets" id="bgPresets"></div>
      </div>
      <div class="setting-section">
        <div class="setting-label">背景遮罩浓度</div>
        <div class="dim-row">
          <input type="range" id="bgDimRange" min="0" max="80" value="16" oninput="onDimChange(this.value)">
          <span class="dim-val" id="bgDimVal">16%</span>
        </div>
      </div>
      <div class="setting-section">
        <button class="btn btn-glass" style="padding:13px;font-size:13px;" onclick="resetBg()">恢复默认背景</button>
      </div>
    </div>
  </div>

function extractVideoIdFromUrl(url) {
  if (!url) return '';
  const m = url.match(/douyin\.com\/video\/(\d{15,25})/) ||
            url.match(/iesdouyin\.com\/share\/video\/(\d{15,25})/) ||
            url.match(/douyin\.com\/share\/video\/(\d{15,25})/);
  return m ? m[1] : '';
}
function parseBingRss(text) {
  const items = [];
  try {
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    const nodes = doc.querySelectorAll('item');
    nodes.forEach(n => {
      const title = (n.querySelector('title')?.textContent || '').trim();
      const link = (n.querySelector('link')?.textContent || '').trim();
      const desc = (n.querySelector('description')?.textContent || '').trim();
      const vid = extractVideoIdFromUrl(link);
      if (vid) items.push({ videoId: vid, title, desc, source: 'Bing', url: 'https://www.douyin.com/video/' + vid });
    });
  } catch (e) {}
  return items;
}
function parseBaiduHtml(html) {
  const items = [];
  const seen = new Set();
  const re = /douyin\.com\\?\/video\\?\/(\d{15,25})/g;
  let m;
  while ((m = re.exec(html)) !== null) {
    const vid = m[1];
    if (seen.has(vid)) continue;
    seen.add(vid);
    const start = Math.max(0, m.index - 300);
    const around = html.slice(start, m.index + 200).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
    items.push({ videoId: vid, title: around.trim().slice(0, 100), desc: '', source: 'Baidu', url: 'https://www.douyin.com/video/' + vid });
  }
  return items;
}
function parseDdgHtml(html) {
  const items = [];
  const re = /<a[^>]+class="result__a"[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
  let m;
  while ((m = re.exec(html)) !== null) {
    let href = m[1];
    const title = m[2].replace(/<[^>]+>/g, '').trim();
    const uddg = href.match(/uddg=([^&]+)/);
    if (uddg) { try { href = decodeURIComponent(uddg[1]); } catch (e) {} }
    const vid = extractVideoIdFromUrl(href);
    if (vid) items.push({ videoId: vid, title, desc: '', source: 'DuckDuckGo', url: 'https://www.douyin.com/video/' + vid });
  }
  return items;
}
async function requestText(url, timeout) {
  timeout = timeout || 12000;
  if (window.webcat && window.webcat.network && window.webcat.network.request) {
    try {
      const r = await withTimeout(window.webcat.network.request({ method: 'GET', url, headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15' }, timeout }), timeout + 500, 'webcat请求');
      if (r && r.ok && typeof r.body === 'string') return r.body;
      throw new Error('webcat 返回异常');
    } catch (e) {}
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(url, { signal: controller.signal, headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15' } });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  } catch (e) { clearTimeout(timer); throw e; }
}
async function searchVideosByKeyword(keyword) {
  if (!keyword || !keyword.trim()) return [];
  const k = keyword.trim();
  logMsg('开始搜索视频: ' + k, 'info');

  const promises = SEARCH_SOURCES.map(async src => {
    const url = src.buildUrl(k);
    try {
      const text = await requestText(url, 12000);
      const items = src.parse(text);
      if (items.length) logMsg(src.name + ' 返回 ' + items.length + ' 条结果', 'ok');
      return items;
    } catch (e) {
      logMsg(src.name + ' 搜索失败: ' + (e.message || '未知'), 'err');
      return [];
    }
  });

  const settled = await Promise.allSettled(promises);
  const all = [];
  settled.forEach(r => { if (r.status === 'fulfilled') all.push(...r.value); });

  const seen = new Set();
  const unique = all.filter(it => {
    if (seen.has(it.videoId)) return false;
    seen.add(it.videoId);
    return true;
  });
  logMsg('搜索完成，去重后共 ' + unique.length + ' 条', unique.length ? 'ok' : 'err');
  return unique;
}

function blobToDataUrl(blob) {

async function ensureDataUrl(src) {

    catch (e) { return src; }
  }
  return src;
}

async function takePhotoAndRecognize() {
  if (scanBusy) return;
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  if (scanStream && video && video.videoWidth > 0) {
    const w = video.videoWidth, h = video.videoHeight;
    const scale = Math.min(1, 1600 / Math.max(w, h));
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    await processScanImage(canvas.toDataURL('image/jpeg', 0.85));
    return;
  }
  if (await tryWebcatCameraCapture()) return;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) {
      try { await processScanImage(await readFileAsDataUrl(f)); } catch (err) { toast('读取图片失败'); }

async function tryWebcatCameraCapture() {
  const wc = window.webcat;
  if (!wc) return false;
  const fns = [
    wc.camera && wc.camera.takePhoto, wc.camera && wc.camera.capture, wc.camera && wc.camera.takePicture,
    wc.media && wc.media.takePhoto, wc.media && wc.media.capture,
    wc.app && wc.app.takePhoto, wc.app && wc.app.capture,
  ];
  for (const fn of fns) {
    if (typeof fn === 'function') {
      try {
        const res = await fn.call(null, { quality: 0.85, camera: 'back', facing: 'environment' });
        const dataUrl = normalizeCameraResult(res);
        if (dataUrl) { await processScanImage(dataUrl); return true; }
      } catch (e) {}
    }
  }
  return false;
}
function normalizeCameraResult(res) {
  if (!res) return '';
  if (typeof res === 'string') {
    if (/^data:image\//i.test(res)) return res;
    if (/^https?:\/\//i.test(res)) return res;
    if (/^[A-Za-z0-9+/=]{200,}$/.test(res)) return 'data:image/jpeg;base64,' + res;
    return '';
  }
  if (typeof res === 'object') {
    for (const c of [res.dataUrl, res.base64, res.data, res.url, res.path, res.filePath, res.image]) {
      if (typeof c === 'string' && c) {
        if (/^data:image\//i.test(c)) return c;
        if (/^https?:\/\//i.test(c)) return c;
        if (/^[A-Za-z0-9+/=]{200,}$/.test(c)) return 'data:image/jpeg;base64,' + c;
      }
    }
  }
  return '';
}
async function processScanImage(imageSrc) {
  if (scanBusy) return;
  scanBusy = true;
  const shootBtn = document.getElementById('scanShootBtn');
  if (shootBtn) shootBtn.disabled = true;
  setScanStatus('正在识别画面文字…', 'busy');
  const dataUrl = await ensureDataUrl(imageSrc);
  scanLastImage = dataUrl;
  showScanPreview(dataUrl);
  try {
    const { text, source } = await runOcrOnImage(dataUrl);
    scanRawText = text || '';
    if (!text || !text.trim()) {
      setScanStatus('未识别到文字，请调整角度、让作者信息更清晰后重试', 'error');
      return;
    }
    logMsg('OCR 完成 [' + source + ']，文字长度 ' + text.length, 'ok');
    const parsed = parseScanText(text);
    scanKeywords = parsed.keywords;
    renderScanResult(parsed);
    setScanStatus('识别完成，共提取 ' + parsed.keywords.length + ' 条信息', 'ok');
    const kw = buildSearchKeyword();
    if (kw) {
      const link = parsed.keywords.find(k => k.type === 'link');
      if (link) {
        setScanStatus('已识别到视频链接，点击下方卡片直接解析', 'ok');
        renderScanDirectLink(link.value);
      } else {
        autoSearchFromScan(kw);
      }
    } else {
      setScanStatus('识别完成，但未提取到可用关键词，可手动输入搜索', 'ok');
    }
  } catch (e) {
    console.error(e);
    setScanStatus('识别失败：' + (e.message || '未知错误'), 'error');
  } finally {
    scanBusy = false;
    if (shootBtn) shootBtn.disabled = false;
  }
}
async function runOcrOnImage(imageSrc) {
  const dataUrl = await ensureDataUrl(imageSrc);
  const wc = window.webcat;
  if (wc) {
    const fns = [
      wc.ocr && wc.ocr.recognize, wc.ocr && wc.ocr.recognition, wc.ocr && wc.ocr.detect,
      wc.ai && wc.ai.ocr, wc.image && wc.image.ocr,
    ];
    for (const fn of fns) {
      if (typeof fn === 'function') {
        try {
          const r = await fn.call(null, dataUrl);
          const t = extractTextFromOcr(r);
          if (t && t.trim()) return { text: t, source: 'webcat' };
        } catch (e) {}
      }
    }
  }
  try {
    const params = new URLSearchParams();
    params.append('base64Image', dataUrl);
    params.append('language', 'chs');
    params.append('isOverlayRequired', 'false');
    params.append('OCREngine', '2');
    params.append('scale', 'true');
    const url = 'https://api.ocr.space/parse/image';
    const headers = { 'apikey': 'helloworld', 'Content-Type': 'application/x-www-form-urlencoded' };
    let data = null;
    if (wc && wc.network && wc.network.request) {
      try {
        const r = await withTimeout(wc.network.request({ method: 'POST', url, headers, body: params.toString(), timeout: 20000 }), 20500, 'OCR');
        if (r && r.ok && typeof r.body === 'string') { try { data = JSON.parse(r.body); } catch (e) {} }
      } catch (e) {}
    }
    if (!data) {
      const res = await fetch(url, { method: 'POST', headers, body: params.toString() });
      if (res.ok) data = await res.json();
    }
    if (data && Array.isArray(data.ParsedResults) && data.ParsedResults.length) {
      const t = data.ParsedResults.map(r => r.ParsedText || '').join('\n');
      if (t.trim()) return { text: t, source: 'ocr.space' };
    }
  } catch (e) { console.warn('ocr.space 失败', e); }
  return { text: '', source: '' };
}
function extractTextFromOcr(r) {
  if (!r) return '';
  if (typeof r === 'string') return r;
  if (typeof r === 'object') {
    if (typeof r.text === 'string') return r.text;
    if (typeof r.result === 'string') return r.result;
    if (Array.isArray(r.words_result)) return r.words_result.map(w => w.words || '').join('\n');
    if (Array.isArray(r.results)) return r.results.map(w => w.text || w.words || '').join('\n');
    if (Array.isArray(r.data)) return r.data.map(w => w.text || w.words || w.content || '').join('\n');
  }
  return '';
}
function parseScanText(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const fullText = lines.join('\n');
  const keywords = [];
  const seen = new Set();
  const add = (type, value) => {
    if (!value) return;
    const v = String(value).trim();
    if (!v || seen.has(type + '|' + v)) return;
    seen.add(type + '|' + v);
    keywords.push({ type, value: v });
  };
  const urlMatches = fullText.match(/https?:\/\/[a-zA-Z0-9\-._~:/?#\[\]@!$&'()*+,;=%]+/g) || [];
  urlMatches.forEach(u => {
    const clean = sanitizeUrl(u);
    if (isValidUrl(clean)) add('link', clean);
  });
  for (const m of fullText.matchAll(/(v\.douyin\.com|v\.kuaishou\.com|b23\.tv|xhslink\.com|v\.dola\.com)\/[A-Za-z0-9_\-]+/g)) {
    const u = 'https://' + m[0];
    if (isValidUrl(u)) add('link', u);
  }
  for (const m of fullText.matchAll(/@\s*([^\s@#，,。.！!？?：:；;、（）()【】\[\]]{1,30})/g)) add('author', m[1]);
  for (const m of fullText.matchAll(/(?:抖音号|快手号|小红书号|B站号|UP主|视频号)\s*[:：]?\s*([A-Za-z0-9_\-.·]{2,30})/g)) add('authorId', m[1]);
  for (const m of fullText.matchAll(/#\s*([^\s#@，,。.！!？?：:；;、（）()【】\[\]]{1,30})/g)) add('tag', m[1]);
  lines.forEach(line => {
    if (line.length < 5) return;
    if (/^https?:\/\//.test(line)) return;
    if (/^@/.test(line) || /^#/.test(line)) return;
    if (/抖音号|快手号|小红书号|B站号|UP主|点赞|评论|收藏|转发|分享|关注|作品/.test(line)) return;
    const clean = line.replace(/[@#][^\s]*/g, '').replace(/[·•]\s*[\d\.]+[wW万kK]?/g, '').trim();
    if (clean.length >= 6 && /[\u4e00-\u9fa5]/.test(clean)) add('title', clean);
  });
  return { keywords, lines, rawText: text };
}
function buildSearchKeyword() {
  const authors = scanKeywords.filter(k => k.type === 'author').map(k => k.value);
  const titles = scanKeywords.filter(k => k.type === 'title').map(k => k.value);
  const tags = scanKeywords.filter(k => k.type === 'tag').map(k => k.value);
  if (authors[0] && titles[0]) return authors[0] + ' ' + titles[0];
  if (titles[0]) return titles[0];
  if (authors[0]) return authors[0];
  if (tags[0]) return tags[0];
  return '';
}

  document.getElementById('scanRawText').textContent = parsed.rawText || '';

}
async function autoSearchFromScan(keyword) {

    if (webcat.network) logMsg('webcat.network 可用（绕过 CORS，可搜索）', 'ok');
    if (!webcat.clipboard) return;
    setTimeout(() => {
      try {
        const r = webcat.clipboard.get();
        if (r && r.ok && r.text) {
          const url = extractUrl(r.text);
          if (url && /douyin|kuaishou|bilibili|b23|xhslink|xiaohongshu|doubao|dola|jimeng|channels\.weixin|finder\.video/i.test(url)) {
            const ta = document.getElementById('linkInput');
            if (!ta.value.trim()) { ta.value = url; toast('已自动填入剪贴板链接'); }
          }
        }
      } catch (e) {}
    }, 600);
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doParse();
    if (e.key === 'Escape') {
      const scp = document.getElementById('scanPanel');
      const sp = document.getElementById('settingsPanel');
      const hp = document.getElementById('historyPanel');
      if (scp && scp.classList.contains('show')) closeScanPanel();
      else if (sp && sp.classList.contains('show')) closeSettings();
      else if (hp && hp.classList.contains('show')) closeHistory();
    }
  });
}
</script>
</body>
</html>
